<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - VIP Public School</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #ebd40b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-shadow: 1px 1px 3px #000;
    }
    h1 {
      margin-bottom: 50px;
      font-size: 75px;
      text-shadow: 2px 2px 5px #000;
    }
    form {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
      width: 300px;
      text-align: center;
    }
    input[type="text"],
    input[type="password"] {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      font-size: 1em;
    }
    input[type="submit"] {
      width: 95%;
      padding: 10px;
      margin-top: 15px;
      background-color: #ffd600; 
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      color: #333;
      font-size: 1.1em;
    }
    input[type="submit"]:hover {
      background-color: #eaca1496;
    }
    .signup-form {
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1 class="school-name">VIP Public School</h1>
  
  <form action="/" method="POST">
    <input type="text" name="userid" placeholder="User ID" required /><br />
    <input type="password" name="password" placeholder="Password" required /><br />
    <input type="submit" value="Login" />
  </form>

  <form action="/signup.html" method="GET" class="signup-form">
    <input type="submit" value="Sign Up" />
  </form>
</body>
</html>
