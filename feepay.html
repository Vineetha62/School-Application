<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Payment</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="pay">
    <h1>Fee Payment</h1>
    <form action="/submit-fee" method="POST">

        <!-- Student details from Admission Form -->
        <label>Student ID:</label>
        <input type="text" name="StudentId" id="StudentId" readonly><br><br>

        <label>Student Name:</label>
        <input type="text" name="Name" id="Name" readonly><br><br>

        <label>Standard:</label>
        <input type="text" name="Standard" id="Standard" readonly><br><br>

        <!-- Fee details -->
        <label for="Amount">Fee Amount:</label>
        <input type="text" id="Amount" name="Amount" readonly required><br><br>

        <label for="Date">Payment Date:</label>
        <input type="date" id="Date" name="Date" required><br><br>

        <label for="Mode">Payment Mode:</label>
        <select id="Mode" name="Mode" required>
            <option value="">--Select Mode--</option>
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="UPI">UPI</option>
            <option value="Bank Transfer">Bank Transfer</option>
        </select><br><br>

        <button type="submit">Submit Fee</button>
    </form>

    <script>
        // Extract query parameters and fill inputs
        const params = new URLSearchParams(window.location.search);
        document.getElementById('StudentId').value = params.get('StudentId');
        document.getElementById('Name').value = params.get('Name');
        document.getElementById('Standard').value = params.get('Standard');
const standard = params.get('Standard');
document.getElementById('Standard').value = standard;

const fee = parseInt(standard) * 10000;
        if (!isNaN(fee)) {
            document.getElementById('Amount').value = fee;
        }
    </script>
</body>
</html>
