<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css" />

</head>
<body class="signup">
    <h2>Sign Up</h2>
    <form action="/signup" method="POST">
        <input type="text" name="userid" placeholder="New User ID" required /><br>
        <input type="password" name="password" placeholder="New Password" required /><br>
        <input type="submit" value="Create Account" />
    </form>
</body>
</html>
